AWSTemplateFormatVersion: '2010-09-09'
Description: Slack Integration For SNS Alerts.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Mandatory tags
        Parameters:
          - CostcentreTag
          - ProjectTag
      - Label:
          - default: Project tags
        Parameters:
          - EnvironmentTag
          - OwnerTag
          - LiveTag
Parameters:
  IamBoundaryPolicyName:
    Type: String
    Default: ccoe/js-developer
    AllowedPattern: '[a-zA-Z0-9-\/.]+'
  CostcentreTag:
    AllowedPattern: '[\x20-\x7E]+'
    ConstraintDescription: Must be ASCII
    MaxLength: 128
    MinLength: 2
    Type: String
    Default: PD7563
  EnvironmentTag:
    AllowedPattern: '[\x20-\x7E]+'
    ConstraintDescription: Must be ASCII
    MaxLength: 128
    MinLength: 2
    Type: String
    Default: nonprod
  OwnerTag:
    AllowedPattern: '[\x20-\x7E]+'
    ConstraintDescription: Must be ASCII
    MaxLength: 128
    MinLength: 2
    Type: String
    Default: supply-chain
  ProjectTag:
    AllowedPattern: '[\x20-\x7E]+'
    ConstraintDescription: Must be ASCII
    MaxLength: 128
    MinLength: 2
    Type: String
  LiveTag:
    Type: String
    Description: Tag for mgmt account.
    AllowedValues:
      - 'yes'
      - 'no'
    Default: 'no'
  ConfigurationNameParam:
    Type: String
    Description: The name of the configuration.
    Default: sc-sss-nonprod-notifications
  SlackChannelIdParam:
    Type: String
    Description: The ID of the Slack channel. To get the ID, open Slack, right click on the channel name in the left pane, then choose Copy Link. The channel ID is the 9-character string at the end of the
      URL. For example, ABCBBLZZZ.
  SlackWorkspaceIdParam:
    Type: String
    Description: The ID of the Slack workspace authorized with AWS Chatbot. To get the workspace ID, you must perform the initial authorization flow with Slack in the AWS Chatbot console. Then you can copy
      and paste the workspace ID from the console. For more details, see steps 1-4 in Setting Up AWS Chatbot with Slack in the AWS Chatbot User Guide.
    Default: TP8TW8VTJ
  LoggingLevelParam:
    Type: String
    Description: Specifies the logging level for this configuration. This property affects the log entries pushed to Amazon CloudWatch Logs. Logging levels include ERROR, INFO, or NONE.
    AllowedValues:
      - ERROR
      - INFO
      - NONE
    Default: NONE
Resources:
  ReadOnlyRoleForChatBot:
    Properties:
      Description:
        Fn::Sub: ChatBot IAM Role in for notifications to Slack
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${IamBoundaryPolicyName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - Fn::Sub: rds.${AWS::URLSuffix}
            Condition:
              Bool:
                aws:SecureTransport: 'true'
      Policies:
        - PolicyName: ReadOnlyPolicyForChatBot
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: ReadOnlyForChatBot
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                  - logs:Get*
                  - logs:List*
                  - logs:Describe*
                  - logs:TestMetricFilter
                  - logs:FilterLogEvents
                  - sns:Get*
                  - sns:List*
                Effect: Allow
                Resource: '*'
      Tags:
        - Key: costcentre
          Value:
            Ref: CostcentreTag
        - Key: environment
          Value:
            Ref: EnvironmentTag
        - Key: live
          Value:
            Ref: LiveTag
        - Key: owner
          Value:
            Ref: OwnerTag
        - Key: project
          Value:
            Ref: ProjectTag
    Type: AWS::IAM::Role
  SlackIntegration:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName:
        Ref: ConfigurationNameParam
      IamRoleArn:
        Fn::GetAtt:
          - ReadOnlyRoleForChatBot
          - Arn
      LoggingLevel:
        Ref: LoggingLevelParam
      SlackChannelId:
        Ref: SlackChannelIdParam
      SlackWorkspaceId:
        Ref: SlackWorkspaceIdParam
      SnsTopicArns:
        - arn:aws:sns:eu-west-1:699307468732:alert-kafka-crittical-alerts-devel-SSSAlarmTopic-NR89EFSPESNV
        - arn:aws:sns:eu-west-1:699307468732:cw-sss-transactions-Alerts-dev-SSSAlarmTopic-kC85XPvBARiq
