  #         Value: !Ref ApplicationName
  #     Statistic: "Maximum"
  #     Period: 300  # 5 minutes
  #     EvaluationPeriods: 1
  #     Threshold: 10000  # Customize based on your application's threshold
  #     ComparisonOperator: "GreaterThanOrEqualToThreshold"
  #     AlarmActions:
  #       - !Ref AlarmSNSTopic
      #Unit: "Count"

  # Callout for Records Lag Max Alarm
  FlinkRecordsLagMaxAlarmCallout:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CALLOUT-${ApplicationName}-RecordsLagMax-Alarm"
      AlarmDescription: "Alarm for maximum records lag in Flink Application."
      MetricName: "records_lag_max"
      Namespace: "AWS/KinesisAnalytics"
      Dimensions:
        - Name: "Application"
          Value: !Ref ApplicationName
      Statistic: "Maximum"
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 25000  # Customize based on your application's threshold
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      AlarmActions:
        - !Ref AlarmSNSTopic
        - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cosmosIncidentCreation
      #Unit: "Count"

 # Downtime Alarm
  FlinkDowntimeAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CALLOUT-${ApplicationName}-Downtime-Alarm"
      AlarmDescription: "Alarm for downtime in Flink Application."
      MetricName: "downtime"  # Metric name for downtime
      Namespace: "AWS/KinesisAnalytics"
      Dimensions:
        - Name: "Application"
          Value: !Ref ApplicationName
      Statistic: "Sum"  # Assuming we want the total downtime
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1  # Customize based on your application's downtime threshold
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      AlarmActions:
        - !Ref AlarmSNSTopic
        - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cosmosIncidentCreation
      #Unit: "Seconds"  # Assuming downtime is measured in seconds

  # Log type error Alarm and callout
  LogTypeErrorAlarmCALLOUT:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName:  !Sub "CALLOUT-${ApplicationName}-LogTypeErrorAlarm"
      AlarmDescription: "Alarm for log type error metric filter"
      Namespace: !Ref MetricNamespace
      Dimensions:
        - Name: "Application"
          Value: !Ref ApplicationName
      MetricName: "LogTypeError"
      Statistic: "Maximum"
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Threshold: 1
      DatapointsToAlarm: 5
      EvaluationPeriods: 5
      Period: 60  # 1 minute
      AlarmActions:
        - !Ref AlarmSNSTopic
        - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cosmosIncidentCreation

  # LogTypeErrorAlarm:
