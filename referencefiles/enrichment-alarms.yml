  # Number of Failed Checkpoints Alarm
  FlinkFailedCheckpointsAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "${ApplicationName}-FailedCheckpoints-Alarm"
      AlarmDescription: "Alarm for number of failed checkpoints in Flink Application."
      MetricName: "numberOfFailedCheckpoints"
      Namespace: "AWS/KinesisAnalytics"
      Dimensions:
        - Name: "Application"
          Value: !Ref ApplicationName
      Statistic: "Maximum"
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 5  # Customize based on your application's threshold
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      AlarmActions:
        - !Ref AlarmSNSTopic
      #Unit: "Count"

  # Records Lag Max Alarm
  # FlinkRecordsLagMaxAlarm:
  #   Type: "AWS::CloudWatch::Alarm"
  #   Properties:
  #     AlarmName: !Sub "${ApplicationName}-RecordsLagMax-Alarm"
  #     AlarmDescription: "Alarm for maximum records lag in Flink Application."
  #     MetricName: "records_lag_max"
  #     Namespace: "AWS/KinesisAnalytics"
  #     Dimensions:
