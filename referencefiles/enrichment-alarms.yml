  #     Period: 60  # 1 minute
  #     AlarmActions:
  #       - !Ref AlarmSNSTopic

  # Kafka-Data-Ingestion-Stops Alarm and callout
  KafkaDataIngestionStopsCALLOUT:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName:  !Sub "CALLOUT-${ApplicationName}-KafkaDataIngestionStops-Alarm"
      AlarmDescription: "Alarm triggers when no records are ingested from Kafka for 2 minutes"
      Namespace: "AWS/KinesisAnalytics"
      Dimensions:
        - Name: "Application"
          Value: !Ref ApplicationName
      MetricName: "numRecordsInPerSecond"
      Statistic: "Maximum"
      ComparisonOperator: "LessThanOrEqualToThreshold"
      Threshold: 0
      DatapointsToAlarm: 5
      EvaluationPeriods: 5
      Period: 60  # 1 minute
      AlarmActions:
        - !Ref AlarmSNSTopic
        - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cosmosIncidentCreation

  CommitedOffsetLag:
    Type: AWS::CloudWatch::Alarm
    Properties:
        AlarmName: !Sub "CALLOUT-${ApplicationName}-Consumer-Lag-ComittedOffsets-Alarm
        ActionsEnabled: true
        AlarmActions:
          - !Ref AlarmSNSTopic
          - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:cosmosIncidentCreation
        MetricName: committedOffsets
        Namespace: AWS/KinesisAnalytics
        Statistic: Maximum
        Dimensions:
            - Name: Application
              Value: !Ref ApplicationName
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: -1
        ComparisonOperator: LessThanOrEqualToThreshold
        TreatMissingData: missing

Outputs:
  SNSAlarmTopicArn:
    Description: "SNS topic for alarm notifications"
    Value: !Ref AlarmSNSTopic
